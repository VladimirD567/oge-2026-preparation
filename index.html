<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ОГЭ: математика и русский — теория и практика</title><style>
:root{--bg:#f6f7fb;--p:#fff;--t:#161b2e;--m:#5b6480;--a:#3d5afe;--g:#13a274;--r:#d93651;--b:#dfe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1325;--p:#182039;--t:#f2f4ff;--m:#a3aecb;--a:#8fa0ff;--g:#5fdcb8;--r:#ff8da0;--b:#2b3658}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 system-ui,Arial}.w{max-width:900px;margin:auto;padding:16px}h1{font-size:28px;margin:8px 0}.m{color:var(--m)}
button{font:inherit;cursor:pointer;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:10px;padding:9px 13px}button.on,button.pr{background:var(--a);color:#fff;border-color:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px;margin:10px 0}
.f{background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:18px;text-align:center}.ok{color:var(--g)}.no{color:var(--r)}input{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--b);background:var(--bg);color:var(--t);width:200px;max-width:100%}li{margin:4px 0}.sol{border-left:3px solid var(--a);padding-left:12px;margin:6px 0 14px}
body{background:radial-gradient(900px 400px at 10% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent),var(--bg)}.w{max-width:980px;padding:20px 18px 60px}.hero{padding:30px 26px;border-radius:22px;background:linear-gradient(135deg,var(--a),#7c4dff);color:#fff;margin:6px 0 18px;box-shadow:0 14px 34px -14px var(--a)}.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px;letter-spacing:-.5px}.hero p{margin:0;opacity:.92;max-width:640px}#subj button{flex:1;min-width:150px;padding:15px;font-size:18px;font-weight:700;border-radius:14px;box-shadow:0 2px 8px -4px #0004}#tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}#tops button{text-align:left;border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.35}button{transition:.15s}button:hover{transform:translateY(-1px);border-color:var(--a)}.card{border-radius:20px;padding:26px;box-shadow:0 10px 30px -18px #0007}.card h2{font-size:28px;margin:0 0 6px;letter-spacing:-.4px}.card h3{font-size:19px;margin:26px 0 6px;padding-top:6px;border-top:1px dashed var(--b)}#body{font-size:17px;line-height:1.8}#body p,#body li{margin:8px 0}.f{font-size:20px;padding:14px 16px;border:1px solid var(--b);border-left:4px solid var(--a);text-align:left;font-weight:600}.rule,.warn,.tip{border-radius:12px;padding:12px 16px;margin:14px 0}.rule{background:color-mix(in srgb,var(--a) 12%,transparent);border-left:4px solid var(--a)}.warn{background:color-mix(in srgb,var(--r) 12%,transparent);border-left:4px solid var(--r)}.tip{background:color-mix(in srgb,var(--g) 13%,transparent);border-left:4px solid var(--g)}.ex{background:var(--bg);border-radius:14px;padding:16px 18px;margin:14px 0}.ex .n{display:inline-block;background:var(--a);color:#fff;border-radius:8px;padding:0 9px;font-size:13px;margin-right:8px}.ex ol{margin:10px 0 0;padding-left:22px}.ex li::marker{color:var(--a);font-weight:700}.sol{background:var(--bg);border-radius:10px;border-left:4px solid var(--a);padding:10px 14px}input{font-size:18px;padding:11px 13px}button.pr{padding:11px 20px;font-weight:700}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.92em}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}</style></head><body><div class="w"><div class="hero"><h1>ОГЭ: математика и русский</h1><p>Понятная теория, примеры с разбором и тренировка с проверкой.</p></div><div class="row" id="subj"></div><div class="row" id="tops"></div><div id="les"></div></div><script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],G=(a,b)=>b?G(b,a%b):Math.abs(a),L=(a,b)=>a*b/G(a,b);
const F=(n,d)=>{let g=G(n,d);n/=g;d/=g;return d==1?''+n:n+'/'+d};
const m=v=>v<0?'−'+(-v):''+v,par=v=>v<0?'('+m(v)+')':''+v,dc=v=>String(+v.toFixed(6)).replace('.',','),sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join(''),sg=v=>v<0?'− '+(-v):'+ '+v,cf=c=>c==1?'x':c==-1?'−x':m(c)+'x';

const M=[
{t:'№6. Дроби и вычисления',th:`<p>Дробь 3/4 — это «3 части из 4 одинаковых». Складывать можно только части <b>одинакового размера</b>.</p><h3>Сложение и вычитание</h3><ol><li>Найди число, которое делится на оба знаменателя (для 4 и 6 — 12).</li><li>Умножь числитель и знаменатель каждой дроби так, чтобы внизу стало это число.</li><li>Сложи или вычти верхние числа, нижнее оставь.</li><li>Сократи дробь, если можно.</li></ol><div class="rule"><b>Пример:</b> 1/2 + 1/3. Общее нижнее — 6. 1/2 = 3/6, 1/3 = 2/6. Складываем: 5/6.</div><div class="warn"><b>Ошибка:</b> 1/2 + 1/3 ≠ 2/5. Нижние числа не складывают!</div><h3>Умножение</h3><p>Верхнее на верхнее, нижнее на нижнее. Сокращать лучше до умножения: 4/9 · 3/8 = (4 с 8 сократились, 3 с 9 сократились) = 1/3 · 1/2 = 1/6.</p><h3>Деление</h3><p>Переверни вторую дробь и умножь: 2/3 : 4/5 = 2/3 · 5/4 = 10/12 = 5/6.</p><h3>Смешанное число</h3><p>2 1/3 — 2 целых и 1/3. В дробь: 2·3 + 1 = 7 сверху, 3 снизу → 7/3.</p>`,
g(){let b=R(2,9),d=R(2,9);while(b==d)d=R(2,9);let a=R(1,b-1),c=R(1,d-1),k=L(b,d),x=a*k/b,y=c*k/d,pl=R(0,1);if(!pl&&x<y){[a,b,c,d]=[c,d,a,b];x=a*k/b;y=c*k/d}
let n=pl?x+y:x-y,res=F(n,k);return[`Вычисли: ${a}/${b} ${pl?'+':'−'} ${c}/${d}`,[n/k],`Ищем число, которое делится и на ${b}, и на ${d}. Это ${k}. Переводим дроби: ${a}/${b} = ${x}/${k}, ${c}/${d} = ${y}/${k}. ${pl?'Складываем':'Вычитаем'} верхние числа: ${x} ${pl?'+':'−'} ${y} = ${n}. Получаем ${n}/${k} = ${res}.`]}},
{t:'№1–5. Практика: проценты',th:`<p>1% — это одна сотая часть: 1% = 1/100 = 0,01.</p><h3>Три типа задач</h3><div class="rule"><b>1. Часть от числа</b> — умножаем. 15% от 240 = 240 · 0,15 = 36.<br><b>2. Число по его части</b> — делим. 30 — это 15% числа. Значит, число = 30 : 0,15 = 200.<br><b>3. Сколько процентов</b> — часть делим на целое: 18 из 24 = 18/24 = 0,75 = 75%.</div><h3>Увеличение и уменьшение</h3><ul><li>Увеличить на p% — умножить на (1 + p/100). +10% — это ×1,1.</li><li>Уменьшить на p% — умножить на (1 − p/100). −20% — это ×0,8.</li><li>Несколько изменений перемножаются: +10% и ещё +10% → ×1,1 · 1,1 = 1,21, то есть +21%, а не +20%.</li></ul><div class="tip"><b>Лайфхак:</b> 10% — сдвинь запятую влево (10% от 360 = 36). 5% — половина от 10%. 25% — четверть. 50% — половина.</div><div class="warn"><b>Ловушка:</b> цена выросла на 20%, потом упала на 20% — вернулась не к исходной, а к 96% (1,2·0,8 = 0,96), то есть −4%.</div><h3>Сложные проценты</h3><p>Вклад растёт на p% каждый год: через n лет он умножится на (1 + p/100)ⁿ. 1000 руб. под 10% на 2 года → 1210 руб.</p>`,
g(){let k=R(2,30)*20,p=P([5,10,15,20,25,30,40,60]),t=R(0,2);if(t==0)return[`Найди ${p}% от числа ${k}.`,[k*p/100],`${p}% — это ${p}/100 = ${dc(p/100)}. Умножаем: ${k} · ${dc(p/100)} = ${k*p/100}.`];
if(t==1)return[`Цена ${k} руб. выросла на ${p}%. Какой стала цена?`,[k*(100+p)/100],`Прибавка: ${p}% от ${k} = ${k*p/100}. Новая цена: ${k} + ${k*p/100} = ${k*(100+p)/100}.`];
return[`${k*p/100} — это ${p}% некоторого числа. Найди это число.`,[k],`Известна часть (${k*p/100}) и её доля (${p}/100 = ${dc(p/100)}). Делим: ${k*p/100} : ${dc(p/100)} = ${k}.`]}},
{t:'№9. Линейные уравнения',th:`<p>Уравнение — это весы: слева и справа поровну. Что делаем с одной стороной, то же и с другой.</p><h3>Как решать</h3><ol><li>Раскрой скобки. Минус перед скобкой меняет все знаки: −(x − 3) = −x + 3.</li><li>Собери слагаемые с x с одной стороны, числа — с другой. При переносе через «=» знак меняется.</li><li>Приведи подобные и раздели на число перед x.</li><li>Проверь: подставь корень в исходное уравнение.</li></ol><div class="rule"><b>Пример:</b> 3(x − 2) + 5 = 2x + 7.<br>Скобки: 3x − 6 + 5 = 2x + 7 → 3x − 1 = 2x + 7.<br>Перенос: 3x − 2x = 7 + 1 → x = 8.<br>Проверка: слева 3·6 + 5 = 23, справа 2·8 + 7 = 23 ✓.</div><div class="warn"><b>Ошибки:</b> забыли поменять знак при переносе; умножили на число не все слагаемые в скобке; −(x − 3) = −x + 3, а не −x − 3.</div><div class="tip">Дроби в уравнении убирай умножением на общее нижнее число: x/2 + x/3 = 5 → ×6 → 3x + 2x = 30 → x = 6.</div>`,
g(){let x=R(-9,9),a=R(2,9),c=P([-4,-3,-2,-1,1,2]),b=R(-12,12),d=(a-c)*x+b;if(c>=a)c=1,d=(a-c)*x+b;let k=a-c;
return[`Реши уравнение: ${a}x ${sg(b)} = ${cf(c)} ${sg(d)}`,[x],`Переносим слагаемые с x влево, числа вправо. При переносе знак меняется: ${a}x ${c<0?'+':'−'} ${Math.abs(c)==1?'':Math.abs(c)}x = ${m(d)} ${b<0?'+':'−'} ${Math.abs(b)}. Считаем: ${k==1?'':k}x = ${m(d-b)}. Делим на ${k}: x = ${m(x)}. Проверка: слева ${a}·${par(x)} ${sg(b)} = ${m(a*x+b)}, справа ${m(c)}·${par(x)} ${sg(d)} = ${m(c*x+d)} — совпало ✓.`]}},
{t:'№9, №20. Квадратные уравнения',th:`<p>Квадратное уравнение — где есть x². Обычно у него <b>два ответа</b> (например, и 3·3, и (−3)·(−3) дают 9).</p><h3>Способ 1: подобрать (если x² без числа)</h3><p>Уравнение x² + px + q = 0. Ищем два числа, у которых:</p><div class="f">сумма = −p, произведение = q</div><div class="rule"><b>Пример:</b> x² − 7x + 12 = 0. Сумма 7, произведение 12 — это 3 и 4.</div><h3>Способ 2: через число D</h3><p>Если подобрать сложно, считаем D = b² − 4ac (a, b, c — числа перед x², x и свободное):</p><div class="f">D = b² − 4ac;  x = (−b ± √D)/(2a)</div><ul><li>D больше 0 — два корня.</li><li>D равно 0 — один корень.</li><li>D меньше 0 — корней нет.</li></ul><h3>Неполные уравнения</h3><ul><li>x² − 7x = 0 → x(x − 7) = 0 → x = 0 или x = 7.</li><li>2x² − 8 = 0 → x² = 4 → x = 2 или x = −2.</li></ul><div class="warn"><b>Ошибки:</b> в формуле −b (если b = −5, будет +5); извлекаем корень из D, а не берём сам D; при D &lt; 0 пишем «корней нет».</div>`,g(){let kind=R(0,2);
if(kind==0){let k=R(2,9);return[`Реши уравнение: x² − ${k}x = 0. Ответ: через «;» от меньшего к большему.`,[0,k],`Выносим x за скобки: x(x − ${k}) = 0. Произведение равно нулю, когда хотя бы один множитель равен нулю: x = 0 или x − ${k} = 0, то есть x = ${k}. Ответ: 0; ${k}.`,1]}
if(kind==1){let a=R(1,4),t=R(2,6),b=a*t*t;return[`Реши уравнение: ${a}x² − ${b} = 0. Все корни через «;» от меньшего к большему.`,[-t,t],`Переносим число вправо: ${a}x² = ${b}, значит x² = ${b}/${a} = ${t*t}. У числа ${t*t} два корня: ${t} и −${t}. Ответ: −${t}; ${t}.`,1]}
let r=R(-8,8),s=R(-8,8);while(!r)r=R(-8,8);while(!s||r==s||r+s==0)s=R(-8,8);if(r>s)[r,s]=[s,r];let p=-(r+s),q=r*s,D=p*p-4*q,pc=Math.abs(p)==1?'':Math.abs(p);
return[`Найди корни уравнения x² ${p<0?'−':'+'} ${pc}x ${sg(q)} = 0. Ответ: через «;» от меньшего к большему.`,[r,s],`a = 1, b = ${m(p)}, c = ${m(q)}. D = b² − 4ac = ${p*p} − ${4*q<0?'('+4*q+')':4*q} = ${D}. Корень из D равен ${Math.sqrt(D)}. Дальше x = (−b ± √D)/(2a) = (${m(-p)} ± ${Math.sqrt(D)})/2: x₁ = ${r}, x₂ = ${s}. Проверка: сумма ${r} + ${par(s)} = ${m(r+s)} = −b ✓, произведение ${r}·${par(s)} = ${m(r*s)} = c ✓.`,1]}},
{t:'№20. Системы уравнений',th:`<p>В системе две «загадки» про одни и те же x и y. Нужна пара чисел, которая подходит к обеим сразу.</p><h3>Способ 1: сложить</h3><p>Если при одной букве стоят противоположные числа (+y и −y), сложи уравнения — эта буква исчезнет.</p><div class="rule"><b>Пример:</b> x + y = 7, x − y = 1. Складываем: 2x = 8 → x = 4, тогда y = 3.</div><h3>Способ 2: подставить</h3><p>Если одна буква уже выражена, подставь её во второе уравнение.</p><div class="rule"><b>Пример:</b> y = 2x, x + y = 9. Вместо y пишем 2x: x + 2x = 9 → 3x = 9 → x = 3, тогда y = 6.</div><div class="warn">Ответ — это ДВА числа. Найти только x — значит решить половину.</div>`,g(){let x=R(-6,9),y=R(-6,9);if(x==y){y++;if(y>9)y=8;}return[`Реши систему: x + y = ${m(x+y)}, x − y = ${m(x-y)}. Ответ: x; y`,[x,y],`При y стоят +1 и −1 — они противоположны, поэтому складываем: (x + y) + (x − y) = ${m(x+y)} + ${par(x-y)}, то есть 2x = ${m(2*x)}, значит x = ${x}. Подставляем в первое: ${par(x)} + y = ${m(x+y)}, значит y = ${m(y)}. Проверка: ${par(x)} − ${par(y)} = ${m(x-y)} ✓.`]}},
{t:'№8. Степени и корни',th:`<p>Степень — короткая запись умножения: 2⁴ = 2·2·2·2 = 16. Корень — действие наоборот: √16 = 4, потому что 4·4 = 16.</p><h3>Правила для степеней</h3><div class="f">aᵐ·aⁿ = aᵐ⁺ⁿ;  aᵐ : aⁿ = aᵐ⁻ⁿ;  (aᵐ)ⁿ = aᵐⁿ;  a⁰ = 1;  a⁻ⁿ = 1/aⁿ</div><ul><li>При умножении одинаковых оснований показатели складываем, при делении — вычитаем, при возведении в степень — умножаем.</li><li>(−2)² = 4, но −2² = −4 (степень без скобок относится только к двойке).</li><li>2⁻³ = 1/2³ = 1/8.</li></ul><h3>Правила для корней</h3><ul><li>√(a·b) = √a · √b.</li><li>Можно выносить: √72 = √(36·2) = 6·√2.</li><li>Складывать можно только одинаковые корни: 2√3 + 5√3 = 7√3.</li></ul><div class="warn"><b>Ловушка:</b> √9 + √16 = 3 + 4 = 7, но √(9 + 16) = √25 = 5. Это разные вещи!</div><div class="tip"><b>Полезно наизусть:</b> 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024 — степени двойки. И квадраты до 20.</div>`,g(){let t=R(0,3);if(t==0){let a=P([2,3,5]),mm=R(2,6),n=R(2,5),k=R(0,mm+n-1);return[`Вычисли: ${a}${sup(mm)} · ${a}${sup(n)} : ${a}${sup(k)}`,[a**(mm+n-k)],`Основание одно — работаем с показателями. При умножении складываем: ${mm} + ${n} = ${mm+n}. При делении вычитаем: ${mm+n} − ${k} = ${mm+n-k}. Получаем ${a}${sup(mm+n-k)} = ${a**(mm+n-k)}.`]}
if(t==1){let a=P([2,5]),n=a==2?R(1,4):R(1,2);return[`Вычисли: ${a}⁻${sup(n)}`,[a**-n],`Значок «минус» перед показателем значит «перевернуть»: a⁻ⁿ = 1/aⁿ. ${a}⁻${sup(n)} = 1/${a}${sup(n)} = 1/${a**n} = ${dc(a**-n)}.`]}
if(t==2){let a=P([2,3]),b=P([5,7]),n=R(2,3);return[`Вычисли: ${a}${sup(n)} · ${b}${sup(n)}`,[(a*b)**n],`Одинаковый показатель — можно объединить основания: aⁿ·bⁿ = (ab)ⁿ. ${a}${sup(n)} · ${b}${sup(n)} = (${a}·${b})${sup(n)} = ${a*b}${sup(n)} = ${(a*b)**n}.`]}
let q=P([4,9,16,25,36,49,64,81,100,121,144]),v=P([4,9,16,25]);return[`Вычисли: √${q} + √${v}`,[Math.sqrt(q)+Math.sqrt(v)],`√${q} = ${Math.sqrt(q)} (потому что ${Math.sqrt(q)}·${Math.sqrt(q)} = ${q}), √${v} = ${Math.sqrt(v)}. Складываем: ${Math.sqrt(q)+Math.sqrt(v)}.`]}},
{t:'№15, №23. Теорема Пифагора',th:`<p>Прямоугольный треугольник — где есть прямой угол (как угол листа). Две стороны у прямого угла — <b>катеты</b> (a и b), самая длинная напротив — <b>гипотенуза</b> (c).</p><div class="f">c² = a² + b²</div><p>Квадрат самой длинной стороны равен сумме квадратов двух коротких.</p><h3>Как решать</h3><ol><li>Найди гипотенузу — она напротив прямого угла и самая длинная.</li><li>Ищем гипотенузу: c = √(a² + b²).</li><li>Ищем катет: a = √(c² − b²).</li></ol><div class="rule"><b>Пример:</b> лестница 13 м, основание в 5 м от стены. Высота = ? c = 13, a = 5. b² = 169 − 25 = 144, b = 12 м.</div><div class="tip"><b>Полезные тройки:</b> 3-4-5, 5-12-13, 8-15-17, 7-24-25 и их удвоения (6-8-10). Узнаёшь — не считай.</div><div class="warn"><b>Ошибка:</b> складывать катеты там, где надо вычитать из гипотенузы.</div>`,g(){let t=P([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=R(1,3),[a,b,c]=t.map(v=>v*k);return R(0,1)?[`Катеты прямоугольного треугольника ${a} и ${b}. Найди гипотенузу.`,[c],`Гипотенуза — самая длинная сторона напротив прямого угла. По теореме Пифагора c² = a² + b² = ${a*a} + ${b*b} = ${a*a+b*b}. c = √${a*a+b*b} = ${c}.`]:[`Гипотенуза ${c}, катет ${a}. Найди второй катет.`,[b],`b² = c² − a² = ${c*c} − ${a*a} = ${c*c-a*a}. b = √${c*c-a*a} = ${b}.`]}},
{t:'№17. Площади фигур',th:`<p>Площадь — сколько квадратиков 1×1 помещается внутри фигуры.</p><ul><li>Прямоугольник: S = a·b (длина × ширина).</li><li>Квадрат: S = a².</li><li>Параллелограмм: S = a·h (сторона × высота к ней).</li><li>Треугольник: S = ½·a·h (половина стороны на высоту).</li><li>Трапеция: S = (a + b)/2 · h (полусумма оснований на высоту).</li><li>Круг: S = πr², длина окружности C = 2πr.</li></ul><p><b>Высота</b> — перпендикуляр к стороне, а не боковая сторона.</p><h3>Примеры</h3><ol><li>Трапеция 6 и 10, высота 4: (6+10)/2 · 4 = 32.</li><li>Треугольник a = 9, h = 6: ½·9·6 = 27.</li><li>Круг r = 3: S = π·9 ≈ 28,3.</li></ol><div class="warn">Высота всегда под прямым углом к основанию. Не путай с боковой стороной.</div><div class="tip">На клетчатой бумаге разбей фигуру на прямоугольники и треугольники и сложи площади.</div>`,g(){let a=R(2,12)*2,b=R(2,12)*2,h=R(2,10);return P([[`Основания трапеции ${a} и ${b}, высота ${h}. Найди площадь.`,[(a+b)/2*h],`Сначала полусумма оснований: (${a} + ${b})/2 = ${(a+b)/2}. Умножаем на высоту: ${(a+b)/2} · ${h} = ${(a+b)/2*h}.`],[`Основание треугольника ${a}, высота ${h}. Найди площадь.`,[a*h/2],`Половина основания на высоту: ½ · ${a} · ${h} = ${a*h/2}.`],[`Сторона параллелограмма ${a}, высота к ней ${h}. Найди площадь.`,[a*h],`Сторона на высоту: ${a} · ${h} = ${a*h}.`]])}},
{t:'№10. Вероятность',th:`<p>Вероятность показывает шанс события: сколько случаев подходит, делим на сколько всего.</p><div class="f">P = подходящие / все возможные</div><ul><li>Всегда от 0 до 1.</li><li>P(не случится) = 1 − P(случится).</li><li>Если два события не связаны, вероятности перемножаются: две монеты, «два орла» = ½ · ½ = ¼.</li></ul><h3>Примеры</h3><ol><li>25 учеников, 10 мальчиков. P(мальчик) = 10/25 = 0,4.</li><li>P(девочка) = 1 − 0,4 = 0,6.</li><li>Кубик, P(чётное) = 3/6 = 0,5 (исходы 2, 4, 6).</li></ol><div class="warn">Ответ не может быть больше 1 или отрицательным.</div>`,g(){let kind=R(0,2),n,r;if(kind==0){n=10;r=P([1,2,3,4,5,6,7,8,9]);}else if(kind==1){n=20;r=P([1,2,4,5,8,10,12,15,16,18]);}else{n=25;r=P([1,5,10,15,20]);}let g=G(r,n);return[`В коробке ${n} шаров, из них ${r} красных. Найди вероятность вынуть красный.`,[r/n],`Подходящих случаев (красные шары): ${r}. Всего шаров: ${n}. P = ${r}/${n}`+(g>1?` = ${F(r,n)}`:'')+` = ${dc(r/n)}.`]}}];

M.unshift({t:'Как устроен ОГЭ по математике',th:`<p>На экзамене <b>25 заданий</b>, максимум <b>31 балл</b>. Время — <b>3 часа 55 минут</b>. Актуальные демоверсия и правила — на fipi.ru.</p><h3>Первая часть (№1–19) — краткий ответ</h3><ul><li><b>№1–5.</b> Задачи про жизнь: участок, квартира, тарифы, шины, печи.</li><li><b>№6.</b> Дроби. <b>№7.</b> Числа на прямой. <b>№8.</b> Степени и корни. <b>№9.</b> Уравнения. <b>№10.</b> Вероятность. <b>№11.</b> Графики. <b>№12.</b> Формулы. <b>№13.</b> Неравенства. <b>№14.</b> Последовательности чисел. <b>№15–19.</b> Геометрия.</li></ul><h3>Вторая часть (№20–25) — полное решение</h3><ul><li><b>№20.</b> Уравнение или система. <b>№21.</b> Текстовая задача. <b>№22.</b> Построение графика. <b>№23–25.</b> Геометрия.</li></ul><div class="tip"><b>План:</b> сначала 1–14, потом 15–19, потом 20–25. Для «3» — минимум <b>8 баллов</b>, из них не меньше <b>2 по геометрии</b>.</div>`,qz:[['Сколько заданий?',['19','25','31'],1,'25 заданий.'],['Минимум для «3»?',['8 баллов, из них ≥2 по геометрии','15 баллов','Вся часть 1'],0,'8 баллов, минимум 2 по геометрии.'],['Самые трудные задания?',['№1–5','№22 и №25','№9 и №10'],1,'№22 (график) и №25 (сложная геометрия).'],['Максимум баллов?',['25','31','37'],1,'31 балл.']],exh:`<p class="m">Образец оформления второй части:</p><div class="ex"><span class="n">№20</span><b>Решите уравнение x² − 5x + 6 = 0.</b><ol><li>a = 1, b = −5, c = 6.</li><li>D = 25 − 24 = 1.</li><li>x₁ = (5 − 1)/2 = 2; x₂ = (5 + 1)/2 = 3.</li><li><b>Ответ:</b> 2; 3.</li></ol></div><div class="warn">Только ответ без решения — балл могут не поставить.</div>`});

const U=[
{t:'Задания 6–7. Орфография: безударные гласные',th:`<p>Безударную гласную проверяем словом, где она под ударением: вода́ — во́ды, зелёный — зе́лень.</p><h3>Как подобрать проверочное слово</h3><ol><li>Найди безударную гласную в корне.</li><li>Измени слово или подбери однокоренное, чтобы на неё упало ударение.</li><li>Напиши ту же букву, что слышишь под ударением.</li></ol><ul><li>Существительное: гора → го́ры.</li><li>Глагол: сидеть → сижу́.</li><li>Прилагательное: зелёный → зе́лень.</li></ul><div class="warn"><b>Ловушка:</b> проверочное слово должно быть однокоренным: «горы» подходит к «гора», но не к «горе́ть».</div><div class="tip"><b>Слова, которые нельзя проверить</b> (запомнить): корова, собака, здравствуйте, вокзал, квартира, лестница, чувство, праздник, сверстник, искусство, бассейн, коллекция.</div><h3>Корни с чередованием (ударением НЕ проверяются!)</h3><ul><li><b>-гар-/-гор-:</b> без ударения О (гореть), под ударением А (загар).</li><li><b>-зар-/-зор-:</b> без ударения А (заря).</li><li><b>-раст-/-рос-:</b> перед СТ или Щ — А (расти), перед С — О (росла). Исключения: росток, Ростов, отрасль.</li><li><b>-лаг-/-лож-:</b> перед Г — А (предлагать), перед Ж — О (предложить).</li><li><b>-бер-/-бир-, -дер-/-дир-, -мер-/-мир-:</b> пишем И, если после корня есть -А- (собирать), иначе Е (соберу).</li></ul>`,o:['а','о','е','и'],i:`в_да|о|вода́ — во́ды\nтр_ва|а|тра́вы\nз_лёный|е|зе́лень\nг_ра|о|го́ры\nр_ка|е|ре́ки\nл_сной|е|лес\nм_рской|о|мо́ре\nч_сы|а|ча́сы\nс_стра|е|се́стры\nж_вой|и|жив, жи́вы\nст_на|е|сте́ны`},
{t:'Задания 6–7. Орфография: парные согласные',th:`<p>В конце слова и перед другой согласной звонкие согласные «оглушаются»: говорим [дуп], а пишем «дуб». Чтобы узнать букву, поставь после согласной гласную — тогда её слышно ясно.</p><p>Парные: б–п, в–ф, г–к, д–т, ж–ш, з–с.</p><h3>Как проверять</h3><ul><li>Измени слово так, чтобы после согласной стояла гласная: дуб → дубы.</li><li>Или подбери однокоренное: травка → трава.</li><li>Подойдут слова с «л, м, н, р, в» после согласной: ночь → ночью.</li></ul><div class="tip">Множественное число или уменьшительная форма — быстрый способ проверки: ложка → ложечка.</div>`,o:['б','п','г','к','д','т','з','с','ж','ш'],i:`ду_|б|ду́бы\nсне_|г|снега́\nморо_|з|моро́зы\nхле_|б|хлеба\nлё_|д|льды́\nса_|д|сады́\nло_ка|ж|ложки\nгра_|д|грады`},
{t:'Задания 6–7. Орфография: -ТСЯ и -ТЬСЯ',th:`<p>Задай вопрос к глаголу.</p><ul><li><b>что делает? что сделает?</b> — пишем <b>-ТСЯ</b> (мягкого знака нет): умывается, прекратится.</li><li><b>что делать? что сделать?</b> — пишем <b>-ТЬСЯ</b>: умываться, прекратиться.</li></ul><div class="f">Он умывае(тся) ← что делает?  Хочу умыва(ться) ← что делать?</div><div class="tip">После «может», «хочет», «пора», «начинает» глагол отвечает на вопрос «что делать?» — пишем -ТЬСЯ.</div><div class="warn">В 3-м лице (он, она, они) на конце -т: умывается, купаются. Мягкого знака нет.</div>`,o:['-тся','-ться'],i:`Ребята любят купа…|-ться|что делать?\nМальчик быстро одева…|-тся|что делает?\nУрок начина…|-тся|что делает?\nПора собира…|-ться|что делать?\nОн стара…|-тся|что делает?\nХочется смея…|-ться|что делать?\nДождь скоро прекрати…|-тся|что сделает?`},
{t:'Задания 6–7. Орфография: Н и НН',th:`<h3>Пишем НН</h3><ul><li>Основа на Н + прибавка -н-: туман → туманный.</li><li>Суффиксы -онн-, -енн-: станционный, соломенный.</li></ul><h3>Пишем Н</h3><ul><li>Суффиксы -ан-, -ян-, -ин-: кожаный, серебряный, песчаный.</li><li>Слово «ветреный» — с одной Н.</li></ul><div class="rule"><b>Исключения:</b> стеклянный, оловянный, деревянный — с двумя Н. Безветренный — тоже с двумя Н (приставка без-). Запомни фразой: «Стеклянный, оловянный, деревянный — самые странные».</div><div class="tip">Сравни: серебряный (-ян-, Н) и оловянный (исключение, НН); кожаный (-ан-, Н) и туманный (туман + -н-, НН).</div>`,o:['н','нн'],i:`стекля…ый|нн|исключение\nкожа…ый|н|суффикс -ан-\nтума…ый|нн|туман + -н-\nсеребря…ый|н|суффикс -ян-\nдеревя…ый|нн|исключение\nпесча…ый|н|суффикс -ан-\nветре…ый|н|исключение\nбезветре…ый|нн|приставка без-\nмасля…ый|н|суффикс -ян-`},
{t:'Задания 6–7. Орфография: НЕ слитно и раздельно',th:`<h3>Пишем РАЗДЕЛЬНО</h3><ul><li>С глаголами: не любить, не знал.</li><li>Если есть «а» с противопоставлением: не весёлый, а грустный.</li><li>С краткими причастиями и «рад»: не рад.</li><li>С усилением «вовсе не», «отнюдь не», «далеко не»: далеко не лучший.</li></ul><h3>Пишем СЛИТНО</h3><ul><li>Если можно заменить одним словом-синонимом: неправда = ложь, невысокий = низкий.</li><li>Если слово без НЕ не существует: ненавидеть, невзгоды, негодовать.</li></ul><h3>Как определить</h3><ol><li>Глагол? → раздельно.</li><li>Есть «а»? → раздельно.</li><li>Заменяется синонимом? → слитно.</li><li>Без НЕ не употребляется? → слитно.</li></ol>`,o:['слитно','раздельно'],i:`(не)любить|раздельно|глагол\n(не)весёлый, а грустный|раздельно|противопоставление\n(не)высокий дом|слитно|синоним «низкий»\n(не)правда|слитно|синоним «ложь»\n(не)ожиданно|слитно|наречие, «внезапно»\n(не)взирая на|слитно|предлог\n(не)рад|раздельно|исключение\n(не)друг, а враг|раздельно|противопоставление`}];

U.unshift({t:'Как устроен ОГЭ по русскому',th:`<p>На экзамене <b>13 заданий</b>, максимум <b>37 баллов</b>. Актуальные материалы — на fipi.ru.</p><h3>Часть 1 (задание 1)</h3><p>Сжатое изложение. Слушаешь текст и пишешь его кратко. Минимум <b>70 слов</b>.</p><h3>Часть 2 (задания 2–12)</h3><ul><li>2–5. Строение предложения и запятые.</li><li>6–7. Орфография.</li><li>8. Как правильно образовать форму слова.</li><li>9. Словосочетание.</li><li>10. Содержание текста.</li><li>11. Выразительные средства языка.</li><li>12. Лексика.</li></ul><h3>Часть 3 (задание 13)</h3><p>Сочинение-рассуждение, минимум <b>70 слов</b>.</p><div class="rule">Распределение баллов: изложение 6 + тест 11 + сочинение 7 + грамотность 13 = 37.</div><div class="warn">Работа короче 70 слов или не по тексту — 0 баллов.</div>`,qz:[['Сколько заданий?',['9','13','25'],1,'13 заданий.'],['Максимум баллов?',['33','37','41'],1,'37 баллов.'],['Минимум слов?',['50','70','100'],1,'70 слов.'],['Из чего состоит тест?',['1–5','2–12','10–13'],1,'Задания 2–12.']]});

U.push({t:'Задание 1. Сжатое изложение',th:`<p>Ты слушаешь текст дважды и пишешь его кратко, сохраняя все <b>главные мысли</b>. Объём не меньше 70 слов.</p><h3>Как оценивают (до 6 баллов)</h3><ul><li><b>Содержание (0–2):</b> все главные мысли переданы.</li><li><b>Сжатие (0–2):</b> ты сократил текст, а не просто переписал.</li><li><b>Логика (0–2):</b> нет путаницы в порядке мыслей.</li></ul><h3>Три способа сократить</h3><ol><li><b>Убрать лишнее</b> — повторы, подробности, примеры.</li><li><b>Обобщить</b> — заменить перечисление одним словом.</li><li><b>Упростить</b> — слить два предложения в одно или заменить прямую речь пересказом.</li></ol><div class="rule"><b>Было:</b> «Утром, когда солнце показалось над лесом, мы вышли к реке и увидели, как стелется туман».<br><b>Стало:</b> «Утром мы вышли к реке, над ней стелился туман».</div><div class="warn">Не пересказывай подробно, не добавляй свои мысли. Каждое предложение в отдельном абзаце — это ошибка.</div>`,exh:`<div class="ex"><span class="n">Обобщение</span><b>Было:</b> «Ребята играли в футбол, волейбол и баскетбол».<br><b>Стало:</b> «Ребята играли в спортивные игры».</div><div class="ex"><span class="n">Упрощение</span><b>Было:</b> «Он сказал: „Я приду завтра“. Но он не пришёл».<br><b>Стало:</b> «Он обещал прийти завтра, но не пришёл».</div><div class="ex"><span class="n">Главные мысли</span>Если в тексте три абзаца — в изложении три главные мысли, по порядку.</div>`,qz:[['«Берёзы, дубы, клёны» → «деревья». Что сделали?',['Убрали лишнее','Обобщили','Упростили'],1,'Обобщили — заменили перечисление одним словом.'],['Минимум слов в изложении?',['50','70','100'],1,'70 слов.'],['Что проверяет «Содержание»?',['Грамотность','Все главные мысли','Почерк'],1,'Главные мысли на месте.'],['Сколько баллов за изложение?',['3','6','9'],1,'До 6 баллов.']]});
U.push({t:'Задание 13. Сочинение-рассуждение',th:`<p>Пишешь рассуждение по прочитанному тексту, минимум 70 слов. Есть три варианта на выбор, но структура одинаковая.</p><h3>Как оценивают (до 7 баллов)</h3><ul><li><b>Тезис (0–1):</b> чёткий ответ на вопрос, а не общие слова.</li><li><b>Примеры (0–3):</b> два примера из текста — 3 балла, один — 2, из жизни — 1.</li><li><b>Логика (0–2):</b> мысли связаны между собой.</li><li><b>Структура (0–1):</b> есть все три части.</li></ul><h3>Схема</h3><ol><li><b>Тезис</b> — прямой ответ на вопрос.</li><li><b>Пример 1</b> из текста и объяснение, как он подтверждает твой ответ.</li><li><b>Пример 2</b> из текста и объяснение.</li><li><b>Вывод</b> — повтори мысль другими словами.</li></ol><div class="warn"><b>Ошибки:</b> пустой тезис; цитата без объяснения; пересказ вместо рассуждения; вывод дословно повторяет тезис.</div>`,exh:`<div class="ex"><span class="n">1. Тезис</span><i>Быть сильным духом — значит не сдаваться и идти вперёд. Об этом рассказывает автор.</i></div><div class="ex"><span class="n">2. Пример 1</span><i>Герой потерял руки, но продолжал рисовать ногами. Значит, трудности не сломили его.</i></div><div class="ex"><span class="n">3. Пример 2</span><i>Его слова «упал — встань» дали девочке опору на всю жизнь.</i></div><div class="ex"><span class="n">4. Вывод</span><i>Таким образом, сила духа — это стойкость и умение поддержать других.</i></div><div class="tip">Связки: «так», «например», «это доказывает», «таким образом».</div>`,qz:[['Сколько баллов за два примера из текста?',['1','2','3'],2,'3 балла.'],['Сколько частей должно быть?',['2','3','5'],1,'Тезис, примеры, вывод.'],['Сочинение не по тексту…',['−1 балл','Не оценивается','Обычно'],1,'Не оценивается.'],['Хороший тезис?',['«Каждый видит красоту по-своему»','«Автор передаёт красоту музыки через эпитеты и олицетворения»'],1,'Конкретный ответ на вопрос.']]});
U.splice(1,0,{t:'Задания 2–5. Строение и запятые',th:`<h3>Основа предложения</h3><p>Подлежащее (кто? что?) и сказуемое (что делает?). «Над полем стелется туман» — основа «туман стелется». Сколько основ — столько частей.</p><h3>Запятые в простом предложении</h3><ul><li><b>Однородные члены</b> (отвечают на один вопрос) без союза или с «а», «но» — запятая. С одиночным «и» — запятой нет: «Он вошёл и сел».</li><li><b>Обороты с -ая, -я</b> (деепричастные) — всегда с запятыми: «Читая книгу, я делаю заметки».</li><li><b>Вводные слова</b> (конечно, к счастью) — с запятыми.</li><li><b>Обращение</b>: «Маша, иди сюда».</li></ul><h3>Запятые в сложном предложении</h3><ul><li><b>Две части с «и», «а», «но»</b> — запятая перед союзом, если у каждой части свои подлежащее и сказуемое.</li><li><b>Главная + зависимая</b> (союзы «что», «чтобы», «когда», «который») — зависимая часть отделяется запятой.</li><li><b>Без союза</b> — запятая, двоеточие или тире по смыслу.</li></ul>`,exh:`<div class="ex"><span class="n">1</span><b>«Дождь кончился и выглянуло солнце».</b> Две основы — дождь кончился и солнце выглянуло. Запятая нужна: «Дождь кончился, и выглянуло солнце».</div><div class="ex"><span class="n">2</span><b>«Увидев друга я обрадовался».</b> Оборот «увидев друга» выделяем: «Увидев друга, я обрадовался».</div><div class="ex"><span class="n">3</span><b>«Он вошёл и сел».</b> Одна основа, одиночное «и» — запятой нет.</div>`,qz:[['Основа в «Над полем стелется туман»?',['Над полем стелется','Туман стелется','Поле туман'],1,'Подлежащее — туман.'],['«Он вошёл (…) и сел» — нужна запятая?',['Да','Нет'],1,'Одна основа, одиночное «и».'],['Оборот «читая книгу» выделяется?',['Нет','Запятыми','Тире'],1,'Всегда запятыми.'],['«Дождь кончился, и выглянуло солнце» — какое это?',['Простое','Сложное с «и»','С придаточной частью'],1,'Две основы с «и» — сложное.']]});
U.push({t:'Задание 9. Словосочетание',th:`<p>Словосочетание — это <b>главное слово + зависимое</b>. Как они связаны:</p><ul><li><b>Зависимое меняется вместе с главным</b> (род, число, падеж): «красивый дом» — красивого дома, красивым домом.</li><li><b>Зависимое стоит в падеже, которого требует главное</b>: «читать книгу», «любовь к природе».</li><li><b>Зависимое не меняется вообще</b> (наречие, глагол в форме «что делать?»): «быстро бежать», «хочу читать».</li></ul><div class="tip">Найди главное слово, задай вопрос и проверь, меняется ли зависимое вместе с главным.</div>`,exh:`<div class="ex"><span class="n">1</span><b>«Новая книга».</b> «Книга» — главное, «новая» меняется вместе с ней (новой книги, новой книгой). Зависимое следует за главным.</div><div class="ex"><span class="n">2</span><b>«Писать письмо».</b> Глагол требует винительного падежа. Зависимое в нужном падеже.</div><div class="ex"><span class="n">3</span><b>«Идти медленно».</b> Наречие не меняется. Зависимое не изменяется.</div>`,qz:[['«Душевное превосходство»?',['Зависимое меняется вместе с главным','Зависимое в падеже','Зависимое не меняется'],0,'Прилагательное повторяет форму.'],['«Читать книгу»?',['Зависимое меняется вместе с главным','Зависимое в падеже','Зависимое не меняется'],1,'Винительный падеж.'],['«Быстро бежать»?',['Зависимое меняется вместе с главным','Зависимое в падеже','Зависимое не меняется'],2,'Наречие не изменяется.'],['«Любовь к природе»?',['Зависимое меняется вместе с главным','Зависимое в падеже','Зависимое не меняется'],1,'Дательный падеж с предлогом.']]});
U.push({t:'Задания 10–12. Анализ текста',th:`<h3>Задание 10</h3><p>Выбрать верные утверждения о тексте. Читай текст целиком и сверяйся с каждым утверждением.</p><h3>Задание 11. Выразительные средства</h3><ul><li><b>Эпитет</b> — яркое, образное определение: «золотая осень».</li><li><b>Сравнение</b> — через «как», «словно»: «сильный, как лев».</li><li><b>Олицетворение</b> — неживому приписывают свойства живого: «ветер шепчет».</li><li><b>Метафора</b> — скрытое сравнение, без слова «как».</li><li><b>Преувеличение</b> и <b>преуменьшение</b>.</li></ul><h3>Задание 12. Лексика</h3><ul><li><b>Синонимы</b> — близкие по значению.</li><li><b>Антонимы</b> — противоположные (добро — зло).</li><li><b>Фразеологизм</b> — устойчивое выражение («бить баклуши»).</li></ul>`,exh:`<div class="ex"><span class="n">1</span><b>«Золотая осень»</b> — яркое определение, эпитет.</div><div class="ex"><span class="n">2</span><b>«Ветер шепчет»</b> — свойство живого у ветра, олицетворение.</div><div class="ex"><span class="n">3</span><b>«Сильный, как лев»</b> — со словом «как», сравнение.</div>`,qz:[['«Золотая осень»?',['Эпитет','Сравнение','Преувеличение'],0,'Образное определение.'],['«Ветер шепчет»?',['Метафора','Олицетворение','Преуменьшение'],1,'Свойство живого у неживого.'],['«Сильный, как лев»?',['Сравнение','Эпитет','Олицетворение'],0,'Есть слово «как».'],['Противоположные по смыслу?',['Синонимы','Антонимы','Омонимы'],1,'Антонимы.']]});

M.forEach(o=>{if(!o.g)return;let g=o.g;o.gen=g;o.g=()=>{let c=[];for(let i=0;i<14;i++)c.push(g());c.sort((a,b)=>(a[0]+a[2]).length-(b[0]+b[2]).length);return c[Math.min(13,Math.round(LV/3*13))]}});

const D={math:M,ru:U};let LV=0,LB=['Лёгкий','Средний','Сложнее','Сложный'],s='math',ti=0,tab='th',cur,sc=0,n=0,rq=[],qi=0,qs=0;
const $=id=>document.getElementById(id);
function hdr(){$('subj').innerHTML=[['math','📐 Математика'],['ru','✍️ Русский язык']].map(([k,l])=>`<button class="${k==s?'on':''}" onclick="s='${k}';ti=0;tab='th';hdr();show()">${l}</button>`).join('');$('tops').innerHTML=D[s].map((x,i)=>`<button class="${i==ti?'on':''}" onclick="ti=${i};tab='th';hdr();show()">${x.t}</button>`).join('')}
function show(){let x=D[s][ti],tb=[['th','Теория'],['ex',s=='math'?'Разобранные примеры':'Примеры'],['pr','Практика и проверка']];sc=0;n=0;rq=[];
$('les').innerHTML=`<div class="card"><h2>${x.t}</h2><div class="row">${tb.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';show()">${l}</button>`).join('')}</div><div id="body"></div></div>`;
let b=$('body');if(tab=='th')b.innerHTML=x.th;else if(tab=='ex')ex(x);else pr(x);fr(b)}
function niceFrac(v){if(!isFinite(v))return String(v);if(Number.isInteger(v))return String(v).replace('-','−');for(let d=2;d<=100;d++){let nn=v*d,r=Math.round(nn);if(Math.abs(nn-r)<1e-9){let sign=r<0?'−':'',g=G(Math.abs(r),d),n2=Math.abs(r)/g,d2=d/g;if(d2===1)return sign+n2;if(d2<=30)return sign+n2+'/'+d2}}return dc(v)}
function fmtAns(a){return a.map(niceFrac).join('; ')}
function mkOptions(correct,sorted){
  function sig(arr){let a=sorted?arr.slice().sort((p,q)=>p-q):arr;return a.map(v=>v.toFixed(6)).join(',')}
  let opts=[correct.slice()],tries=0;
  while(opts.length<4&&tries<300){tries++;let d;
    if(correct.length===1){let c=correct[0],k=Math.floor(Math.random()*6),v=c;
      if(k===0)v=c+(Math.random()<.5?-1:1)*Math.max(1,Math.round(Math.abs(c)*.2));
      else if(k===1)v=c+(Math.random()<.5?-1:1);
      else if(k===2)v=-c;else if(k===3)v=c+(Math.random()<.5?-1:1)*2;else if(k===4)v=c*2;
      else v=c+(Math.random()<.5?-1:1)*Math.max(1,Math.round(Math.abs(c)*.5));
      d=[v]}else{let k=Math.floor(Math.random()*3);
      if(k===0)d=correct.slice().reverse();else if(k===1)d=correct.map(v=>-v);else d=correct.map(v=>v+(Math.random()<.5?-1:1))}
    if(!opts.some(o=>sig(o)===sig(d)))opts.push(d)}
  while(opts.length<4)opts.push(correct.map(v=>+(v+Math.random()*2-1).toFixed(2)));
  for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  return opts}
function ansMath(i){
  let opts=window._opts||[],correct=window._correct||[],sorted=window._sorted;
  function sig(arr){let a=sorted?arr.slice().sort((p,q)=>p-q):arr;return a.map(v=>v.toFixed(6)).join(',')}
  let ok=sig(opts[i])===sig(correct);n++;if(ok)sc++;
  let fb=document.getElementById('fb');
  fb.innerHTML=`<p class="${ok?'ok':'no'}"><b>${ok?'Верно!':'Неверно. Правильный ответ: '+fmtAns(correct)}</b></p><div class="sol">${cur[2]}</div><button class="pr" onclick="pr(D[s][ti])">Новое задание</button>`;fr(fb)}
function splitSteps(sol){return sol.split(/\.\s+(?=[А-ЯA-Z])/).map(t=>t.replace(/\.$/,'')).filter(Boolean)}
function pr(x){
  let b=$('body');
  if(x.qz){qi=0;qs=0;qz(x);return}
  if(s=='math'){
    if(!x.g&&!x.i){b.innerHTML='<div class="tip">Эта тема — обзорная. Потренируйся по демоверсии с сайта fipi.ru.</div>';return}
    LV=Math.min(3,Math.floor(sc/2));cur=x.g();
    let sorted=!!cur[3],opts=mkOptions(cur[1],sorted);
    window._opts=opts;window._correct=cur[1];window._sorted=sorted;
    if(sorted)opts.forEach(o=>o.sort((p,q)=>p-q));
    b.innerHTML=`<p><b>Уровень: ${LB[LV]}</b> <span class="m">— каждые 2 верных ответа сложность повышается</span></p><p class="m">Правильно решено: ${sc} из ${n}</p><p><b>${cur[0]}</b></p><div class="row">${opts.map((o,i)=>`<button onclick="ansMath(${i})">${fmtAns(o)}</button>`).join('')}</div><div id="fb"></div>`;
  }else{
    if(!x.i){b.innerHTML='<div class="tip">Это обзорная тема. Материалы — на fipi.ru.</div>';return}
    if(!rq.length)rq=x.i.split('\n').sort(()=>Math.random()-.5);
    let[a,r,w]=rq[n%rq.length].split('|');cur=[a,r,w];
    b.innerHTML=`<p class="m">Правильно: ${sc} из ${n}</p><p style="font-size:20px"><b>${a}</b></p><div class="row">${x.o.map(o=>`<button onclick="rk('${o}')">${o}</button>`).join('')}</div><div id="fb"></div>`}}
function rk(o){let ok=o==cur[1];n++;if(ok)sc++;$('fb').innerHTML=`<p class="${ok?'ok':'no'}"><b>${ok?'Верно!':'Неверно. Правильный ответ: '+cur[1]}</b></p><div class="sol">${cur[2]}</div><button class="pr" onclick="pr(D[s][ti])">Дальше</button>`;fr($('fb'))}
function ex(x){let b=$('body');if(x.exh){b.innerHTML=x.exh;return}
if(s=='math'){if(!x.g){b.innerHTML='<div class="tip">Обзорная тема — смотри демоверсию на fipi.ru.</div>';return}
  b.innerHTML='<p class="m">Примеры от простого к сложному. Читай шаги и спрашивай: «почему именно так?»</p>'+[0,1,2,3].map(i=>{LV=i;let[q,,sol]=x.g();return`<div class="ex"><span class="n">${i+1}. ${LB[i]}</span><b>${q}</b><ol>${splitSteps(sol).map(t=>'<li>'+t+'</li>').join('')}</ol></div>`}).join('')+'<button class="pr" onclick="show()">Ещё примеры</button>';
}else{if(!x.i){b.innerHTML='<div class="tip">Письменное задание — смотри демоверсию ФИПИ.</div>';return}
  b.innerHTML='<p class="m">Разбор слов с объяснением:</p>'+x.i.split('\n').map(l=>{let[a,r,w]=l.split('|');return`<div class="ex"><b>${a.replace('_','<u>'+r+'</u>').replace('…','<u>'+r+'</u>')}</b> — ${r}<div class="sol">${w}</div></div>`}).join('')}}
